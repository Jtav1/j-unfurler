services:
  unfurler:
    build: .
    restart: unless-stopped
    # Bind to loopback only; Nginx Proxy Manager fronts this and terminates TLS.
    ports:
      - "127.0.0.1:3003:3003"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
